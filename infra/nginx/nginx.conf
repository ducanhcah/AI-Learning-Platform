events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    upstream assessment_api {
        server assessment-process:3001;
    }

    upstream course_api {
        server course-system:3002;
    }

    upstream progress_api {
        server progress-system:3003;
    }

    upstream ai_api {
        server ai-assistant-system:3004;
    }

    upstream notify_api {
        server notification-system:3005;
    }

    upstream web_client {
        server web-client:3000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Experience API - API Gateway Routing
        
        # Course Health
        location = /api/courses/health {
            proxy_pass http://course_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Course API
        location /api/courses/ {
            proxy_pass http://course_api/courses/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Assessment Health
        location = /api/submissions/health {
            proxy_pass http://assessment_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Assessment Submissions API
        location /api/submissions/ {
            proxy_pass http://assessment_api/submissions/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Progress API
        location /api/progress/ {
            proxy_pass http://progress_api/progress/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # AI Assistant API
        location /api/ai/ {
            proxy_pass http://ai_api/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Notifications API
        location /api/notifications/ {
            proxy_pass http://notify_api/notifications/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Web Client Frontend
        location / {
            proxy_pass http://web_client/;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
